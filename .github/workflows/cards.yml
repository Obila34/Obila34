name: Refresh profile cards

on:
  schedule:
    - cron: "17 4 * * *" # daily, 07:17 in Nairobi
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cards
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Refresh contribution data
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api graphql -F query=@data/query.graphql -f login="$GITHUB_REPOSITORY_OWNER" \
            --jq '.data.user' > github.tmp
          mv github.tmp data/github.json

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Render cards
        run: |
          pip install --quiet fonttools brotli pillow
          python scripts/build_cards.py

      - name: Commit cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/github.json cards
          git diff --cached --quiet || git commit -m "Refresh profile cards"
          git push
